<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRUDOKI Arc - Official Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 40px 20px;
      background: #120a1c;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    
    /* Logo Header Utama */
    .profile-logo {
      width: 140px;
      height: 140px;
      border-radius: 20px;
      object-fit: cover;
      border: 3px solid #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.8), inset 0 0 15px rgba(168, 85, 247, 0.5);
      margin-bottom: 16px;
      transition: transform 0.3s ease;
    }
    .profile-logo:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 24px;
      font-weight: 900;
      margin: 0 0 4px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 50%, #64748b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.8));
    }
    p.subtitle {
      margin: 0 0 28px 0;
      font-size: 13px;
      color: #d8b4fe;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #9333ea;
    }

    /* Container Link */
    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Base Styling Tombol */
    .link-btn {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: rgba(30, 16, 48, 0.85);
      border: 2px solid #a855f7;
      border-radius: 14px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.3), inset 0 0 10px rgba(168, 85, 247, 0.2);
      transition: all 0.2s ease-in-out;
    }
    .link-btn:hover {
      background: #a855f7;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.9);
      transform: translateY(-3px);
    }

    /* Wrapper Ikon SVG */
    .icon-box {
      width: 28px;
      height: 28px;
      margin-right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-box svg {
      width: 100%;
      height: 100%;
      fill: #e9d5ff;
      filter: drop-shadow(0 0 5px #c084fc);
    }

    .btn-text {
      flex-grow: 1;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- Logo Header Gambar KRUDOKI Arc -->
  <img src="logo.png" alt="KRUDOKI Arc Logo" class="profile-logo">

  <h1>KRUDOKI Arc</h1>
